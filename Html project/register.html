<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register page</title>
</head>
<body>
    <center>
        <form action="login.html" method="get">
            <h1>Register form</h1>
            <hr>
            <hr>
            <br>
            <label>Name: </label>
            <input type="text" placeholder="Enter name" name="Name" required>
            <br>
            <br>
            <label>DOB: </label>
            <input type="date" placeholder="Enter date" name="DOB"required>
            <br>
            <br>
            <label>Address : </label>
            <input type="text" placeholder="Enter address" name="Address"required>
            <br>
            <br>
            <label>Gender: </label>
            <input type="radio" name="Gender">Male
            <input type="radio" name="Gender">Female
            <br>
            <br>
            <label>Age : </label>
            <input type="number" placeholder="Enter age" name="Age"required>
            <br>
            <br>
            <label>Roll no : </label>
            <input type=" number" placeholder="Enter roll no" name="roll no"required>
            <br>
            <br>
            <label>Clg name : </label>
            <input type="text" placeholder="Enter college" name="clg name"required>
            <br>
            <br>
            <label>Password: </label>
            <input type="password" placeholder="Enter password" name="Password"required>
            <br>
            <br>
            <label>ReType password: </label>
            <input type="password" placeholder="Enter password" name="ReType password"required>
            <br>
            <br>
            <button>Register</button>
        </form>
    </center>
</body>
</html>
